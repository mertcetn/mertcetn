        <!-- The Primary Minecraft GUI Window (Contribution Graph) -->
        <section class="mc-panel p-6 text-[#e2e8f0] mb-8" id="card-crafting-log">

            <!-- Panel Header / Title -->
            <div class="flex flex-wrap items-center justify-between border-b-4 border-[#38383e] pb-4 mb-5">
                <div>
                    <h2
                        class="text-base md:text-lg font-bold text-[#ffffff] pixel-text-shadow tracking-tight flex items-center gap-2">
                        <div class="mc-block-3d-wrap">

                                <div class="face top"></div>
                                <div class="face front"></div>
                                <div class="face side"></div>
                            </div>
                        </div>
                        <span>CRAFTING LOG</span>
                    </h2>
                    <p class="text-[11px] text-[#9ca3af] mt-1 font-sans font-semibold">1,428 blocks forged in the last
                        365 in-game days</p>
                </div>
            </div>

            <!-- Month Labels -->
            <div
                class="hidden md:grid grid-flow-col auto-cols-fr pl-8 pr-2 text-[10px] font-bold text-[#9ca3af] mb-2 text-left">
                <span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span>
                <span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span>
            </div>

                    <span class="h-[15px] leading-[15px]">Fri</span>
